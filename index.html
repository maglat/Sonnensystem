<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 Das Sonnensystem - Interaktive Reise</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f23 100%);
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }
        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }
        h1 {
            font-size: 2em;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }
        .subtitle {
            font-size: 0.9em;
            opacity: 0.8;
        }
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .btn.active {
            background: #4facfe;
            border-color: #4facfe;
        }
        .planet-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            position: relative;
        }
        .sun {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00, #ff4500);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 165, 0, 0.6), 0 0 100px rgba(255, 100, 0, 0.4);
            position: relative;
            z-index: 10;
        }
        .orbit {
            position: absolute;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .orbit:hover {
            border-color: rgba(255,255,255,0.3);
        }
        .planet {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.3s ease;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .planet:hover {
            transform: translate(-50%, -50%) scale(1.3);
            z-index: 100;
        }
        .planet-label {
            position: absolute;
            top: -20px;
            white-space: nowrap;
            font-size: 11px;
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        .planet:hover .planet-label {
            opacity: 1;
        }
        /* Planet sizes and colors */
        .mercury { width: 12px; height: 12px; background: radial-gradient(circle at 30% 30%, #b5b8b3, #878b87); }
        .venus { width: 22px; height: 22px; background: radial-gradient(circle at 30% 30%, #e6e6a8, #cca352); }
        .earth { width: 24px; height: 24px; background: radial-gradient(circle at 30% 30%, #4b9cd3, #2e538f); }
        .mars { width: 16px; height: 16px; background: radial-gradient(circle at 30% 30%, #ff6b6b, #c74444); }
        .jupiter { width: 60px; height: 60px; background: linear-gradient(180deg, #d4a574 0%, #cd853f 20%, #d4a574 40%, #cd853f 60%, #d4a574 80%, #cd853f 100%); }
        .saturn { width: 50px; height: 50px; background: radial-gradient(circle at 30% 30%, #f4d03f, #e6ac00); }
        .saturn::before {
            content: '';
            position: absolute;
            width: 80px;
            height: 12px;
            border: 2px solid rgba(255,255,255,0.6);
            border-radius: 50%;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
        .uranus { width: 30px; height: 30px; background: radial-gradient(circle at 30% 30%, #73c6b6, #40918d); }
        .neptune { width: 28px; height: 28px; background: radial-gradient(circle at 30% 30%, #5b7fef, #3949ab); }
        .info-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 200;
        }
        .info-panel.open {
            transform: translateY(0);
        }
        .info-panel h2 {
            color: #4facfe;
            margin-bottom: 10px;
        }
        .info-panel table {
            width: 100%;
            max-width: 400px;
            margin-top: 10px;
        }
        .info-panel td {
            padding: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .info-panel td:first-child {
            font-weight: 600;
            color: #aaa;
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        @media (max-width: 600px) {
            .sun { width: 60px; height: 60px; }
            h1 { font-size: 1.5em; }
            .planet-label { font-size: 9px; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <header>
        <h1>🌌 Das Sonnensystem</h1>
        <p class="subtitle">Interaktive Reise durch unser kosmisches Zuhause</p>
    </header>
    
    <div class="controls">
        <button class="btn active" onclick="setView('orbit')">Umlaufbahn</button>
        <button class="btn" onclick="setView('static')">Statisch</button>
    </div>

    <div class="planet-container">
        <div class="sun"></div>
        
        <!-- Mercury -->
        <div class="orbit" style="width: 140px; height: 140px;">
            <div class="planet mercury" onclick="showInfo('Mercury')">
                <span class="planet-label">Merkur</span>
            </div>
        </div>
        
        <!-- Venus -->
        <div class="orbit" style="width: 200px; height: 200px;">
            <div class="planet venus" onclick="showInfo('Venus')">
                <span class="planet-label">Venus</span>
            </div>
        </div>
        
        <!-- Earth -->
        <div class="orbit" style="width: 280px; height: 280px;">
            <div class="planet earth" onclick="showInfo('Earth')">
                <span class="planet-label">Erde</span>
            </div>
        </div>
        
        <!-- Mars -->
        <div class="orbit" style="width: 360px; height: 360px;">
            <div class="planet mars" onclick="showInfo('Mars')">
                <span class="planet-label">Mars</span>
            </div>
        </div>
        
        <!-- Jupiter -->
        <div class="orbit" style="width: 500px; height: 500px;">
            <div class="planet jupiter" onclick="showInfo('Jupiter')">
                <span class="planet-label">Jupiter</span>
            </div>
        </div>
        
        <!-- Saturn -->
        <div class="orbit" style="width: 650px; height: 650px;">
            <div class="planet saturn" onclick="showInfo('Saturn')">
                <span class="planet-label">Saturn</span>
            </div>
        </div>
        
        <!-- Uranus -->
        <div class="orbit" style="width: 780px; height: 780px;">
            <div class="planet uranus" onclick="showInfo('Uranus')">
                <span class="planet-label">Uranus</span>
            </div>
        </div>
        
        <!-- Neptune -->
        <div class="orbit" style="width: 900px; height: 900px;">
            <div class="planet neptune" onclick="showInfo('Neptune')">
                <span class="planet-label">Neptun</span>
            </div>
        </div>
    </div>

    <div class="info-panel" id="infoPanel">
        <button class="close-btn" onclick="closeInfo()">&times;</button>
        <h2 id="planetName"></h2>
        <p id="planetDesc"></p>
        <table id="planetData"></table>
    </div>

    <script>
        // Planet data
        const planets = {
            'Mercury': {
                name: 'Merkur',
                desc: 'Der sonnennächste und kleinste Planet des Sonnensystems. Keine Atmosphäre, extreme Temperaturen.',
                data: {
                    'Durchmesser': '4.880 km',
                    'Entfernung zur Sonne': '58 Mio. km',
                    'Umlaufzeit': '88 Tage',
                    'Oberflächentemperatur': '-173°C bis 427°C',
                    'Mond': 'Kein',
                    'Entdeckung': 'Antike'
                }
            },
            'Venus': {
                name: 'Venus',
                desc: 'Der heißeste Planet mit dichter Atmosphäre aus CO₂. Rotiert rückwärts.',
                data: {
                    'Durchmesser': '12.104 km',
                    'Entfernung zur Sonne': '108 Mio. km',
                    'Umlaufzeit': '225 Tage',
                    'Oberflächentemperatur': '462°C',
                    'Mond': 'Kein',
                    'Entdeckung': 'Antike'
                }
            },
            'Earth': {
                name: 'Erde',
                desc: 'Unser Zuhause. Der einzige bekannte Planet mit Leben. Viel Wasser und Sauerstoffatmosphäre.',
                data: {
                    'Durchmesser': '12.742 km',
                    'Entfernung zur Sonne': '150 Mio. km',
                    'Umlaufzeit': '365,25 Tage',
                    'Oberflächentemperatur': '-88°C bis 58°C',
                    'Mond': '1 (Der Mond)',
                    'Entdeckung': 'N/A'
                }
            },
            'Mars': {
                name: 'Mars',
                desc: 'Der Rote Planet. Trocken, kalt, mit dünnen Atmosphäre. Ziel zukünftiger Missionen.',
                data: {
                    'Durchmesser': '6.779 km',
                    'Entfernung zur Sonne': '228 Mio. km',
                    'Umlaufzeit': '687 Tage',
                    'Oberflächentemperatur': '-140°C bis 20°C',
                    'Mond': '2 (Phobos, Deimos)',
                    'Entdeckung': 'Antike'
                }
            },
            'Jupiter': {
                name: 'Jupiter',
                desc: 'Der größte Planet. Gasriese mit Great Red Spot (Sturm). Über 79 Monde.',
                data: {
                    'Durchmesser': '139.820 km',
                    'Entfernung zur Sonne': '778 Mio. km',
                    'Umlaufzeit': '11,8 Jahre',
                    'Oberflächentemperatur': '-108°C',
                    'Mond': '95+',
                    'Entdeckung': 'Antike'
                }
            },
            'Saturn': {
                name: 'Saturn',
                desc: 'Der Planet der Ringe. Gasriese aus Wasserstoff und Helium. Leicht genug, um auf Wasser zu schwimmen.',
                data: {
                    'Durchmesser': '116.460 km',
                    'Entfernung zur Sonne': '1,4 Mrd. km',
                    'Umlaufzeit': '29,5 Jahre',
                    'Oberflächentemperatur': '-138°C',
                    'Mond': '146+',
                    'Entdeckung': 'Antike'
                }
            },
            'Uranus': {
                name: 'Uranus',
                desc: 'Der Eisriese, der auf der Seite liegt. Hellblau durch Methan in der Atmosphäre.',
                data: {
                    'Durchmesser': '50.724 km',
                    'Entfernung zur Sonne': '2,9 Mrd. km',
                    'Umlaufzeit': '84 Jahre',
                    'Oberflächentemperatur': '-195°C',
                    'Mond': '27',
                    'Entdeckung': '1781 (Herschel)'
                }
            },
            'Neptune': {
                name: 'Neptun',
                desc: 'Der windigste Planet. Tiefblauer Eisriese am Rand des Sonnensystems.',
                data: {
                    'Durchmesser': '49.244 km',
                    'Entfernung zur Sonne': '4,5 Mrd. km',
                    'Umlaufzeit': '165 Jahre',
                    'Oberflächentemperatur': '-201°C',
                    'Mond': '14',
                    'Entdeckung': '1846'
                }
            }
        };

        // Create stars
        function createStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(star);
            }
        }

        // Animation
        let currentView = 'orbit';
        let angles = {};
        let animationId;

        function animate() {
            if (currentView === 'orbit') {
                Object.keys(angles).forEach(key => {
                    angles[key] += 0.001;
                    const planet = document.querySelector(`.${key} .planet`);
                    const orbitSize = document.querySelector(`.${key}`).offsetWidth;
                    const x = Math.cos(angles[key]) * (orbitSize / 2);
                    const y = Math.sin(angles[key]) * (orbitSize / 2);
                    planet.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                });
                animationId = requestAnimationFrame(animate);
            }
        }

        function setView(view) {
            currentView = view;
            document.querySelectorAll('.controls .btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase().includes(view === 'orbit' ? 'umlauf' : 'statisch')) {
                    btn.classList.add('active');
                }
            });
            
            if (view === 'orbit') {
                animate();
            } else {
                cancelAnimationFrame(animationId);
                // Reset positions
                const orbits = ['mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];
                orbits.forEach((key, i) => {
                    angles[key] = (i * 45 * Math.PI) / 180; // 45 degree spacing
                    const planet = document.querySelector(`.${key} .planet`);
                    const orbitSize = document.querySelector(`.${key}`).offsetWidth;
                    const x = Math.cos(angles[key]) * (orbitSize / 2);
                    const y = Math.sin(angles[key]) * (orbitSize / 2);
                    planet.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
                });
            }
        }

        // Info panel
        function showInfo(planetKey) {
            const info = planets[planetKey];
            const panel = document.getElementById('infoPanel');
            
            document.getElementById('planetName').textContent = info.name;
            document.getElementById('planetDesc').textContent = info.desc;
            
            const table = document.getElementById('planetData');
            table.innerHTML = '';
            
            Object.entries(info.data).forEach(([key, value]) => {
                table.innerHTML += `<tr><td>${key}</td><td>${value}</td></tr>`;
            });
            
            panel.classList.add('open');
        }

        function closeInfo() {
            document.getElementById('infoPanel').classList.remove('open');
        }

        // Initialize
        createStars();
        setView('orbit');
    </script>
</body>
</html>
